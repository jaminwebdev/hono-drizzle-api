name: hono-drizzle-production

x-database-settings: &database-settings
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}

services:
  api:
    build:
      context: .
      target: runtime
    environment:
      <<: *database-settings
      APP_ENV: ${APP_ENV:?Set APP_ENV=production in .env.production}
      API_PORT: ${API_PORT:-3001}
      POSTGRES_PORT: ${POSTGRES_PORT:-5434}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:${API_PORT:-3001}"
    depends_on:
      db:
        condition: service_healthy
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.API_PORT + '/health/ready', { signal: AbortSignal.timeout(5000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 10s

  db:
    image: postgres:18.6-bookworm
    environment: *database-settings
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  db-tools:
    profiles: [tools]
    build:
      context: .
      target: development
    environment:
      <<: *database-settings
      APP_ENV: ${APP_ENV:?Set APP_ENV=production in .env.production}
    volumes:
      - ./src:/app/src:ro
      - ./drizzle.config.ts:/app/drizzle.config.ts:ro
    depends_on:
      db:
        condition: service_healthy
    init: true

volumes:
  postgres_data:
