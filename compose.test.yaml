# Separate project, credentials, network, and temporary database storage.
# The runner overrides this name with a unique project per run.
name: hono-drizzle-test

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: finance_test
      POSTGRES_PASSWORD: finance_test
      POSTGRES_DB: finance_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U finance_test -d finance_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s
