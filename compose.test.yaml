# Tests run with Bun on the host. This service provides only PostgreSQL.
# Bun's db:test:* commands supply settings from .env.test.
name: finance-tracker-fresh-test

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.test}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.test}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env.test}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: "no"

volumes:
  postgres_data:
