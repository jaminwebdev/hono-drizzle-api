name: hono-drizzle-local

x-database-settings: &database-settings
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.local}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.local}

services:
  api:
    build:
      context: .
      target: development
    environment:
      <<: *database-settings
      APP_ENV: ${APP_ENV:?Set APP_ENV=local in .env.local}
      API_PORT: ${API_PORT:-3000}
      POSTGRES_PORT: ${POSTGRES_PORT:-5433}
    volumes:
      - ./src:/app/src:ro
    ports:
      - "127.0.0.1:${API_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "--no-env-file", "-e", "fetch('http://127.0.0.1:' + process.env.API_PORT + '/health/ready', { signal: AbortSignal.timeout(5000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 10s

  db:
    image: postgres:18.6-bookworm
    environment: *database-settings
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  tools:
    profiles: [tools]
    build:
      context: .
      target: development
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./eslint.config.js:/app/eslint.config.js:ro
      - ./drizzle.config.ts:/app/drizzle.config.ts:ro
      - ./bunfig.toml:/app/bunfig.toml:ro
    command: ["bun", "run", "check"]

  db-tools: &db-tools
    profiles: [tools]
    build:
      context: .
      target: development
    environment:
      <<: *database-settings
      APP_ENV: ${APP_ENV:?Set APP_ENV=local in .env.local}
    volumes:
      - ./src:/app/src:ro
      - ./drizzle.config.ts:/app/drizzle.config.ts:ro
      - ./bunfig.toml:/app/bunfig.toml:ro
    depends_on:
      db:
        condition: service_healthy
    init: true

  studio:
    <<: *db-tools
    profiles: [studio]
    command: ["bun", "--bun", "run", "drizzle-kit", "studio", "--config=drizzle.config.ts", "--host=0.0.0.0", "--port=4983"]
    ports:
      - "127.0.0.1:4983:4983"

volumes:
  postgres_data:
