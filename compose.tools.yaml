# Bootstrap helper for updating dependencies without host Bun.
name: hono-drizzle-tools

services:
  tools:
    image: oven/bun:1.3.14-debian
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      BUN_INSTALL_CACHE_DIR: /tmp/bun-cache
    volumes:
      - .:/app
    tmpfs:
      # Tools such as esbuild run native programs from this temporary folder.
      - /app/node_modules:exec,mode=1777
    ports:
      - "127.0.0.1:${API_PORT:-3000}:${API_PORT:-3000}"
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run check"]
